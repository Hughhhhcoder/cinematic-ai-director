name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - run: python scripts/check_local_links.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: docs deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docs:
    name: Docs required
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Require build and applicable deploy
        run: |
          test "${{ needs.build.result }}" = success
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "${{ needs.deploy.result }}" = skipped
          else
            test "${{ needs.deploy.result }}" = success
          fi
