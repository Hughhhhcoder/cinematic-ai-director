name: Bug report
description: Report a reproducible CLI, schema, installer, or export defect.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not upload identities without consent, credentials, cookies, rejected candidates, or private project media.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.6.5
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command and a sanitized minimal manifest when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, absolute private paths, non-consensual identities, and private media.
          required: true
