[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cinematic-ai-director"
version = "1.6.0"
description = "Evidence-driven, offline production tooling for consistent live-action AI filmmaking."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Hughhhhcoder"}]
keywords = ["codex", "ai-filmmaking", "cinematography", "storyboard", "higgsfield"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://hughhhhcoder.github.io/cinematic-ai-director/"
Documentation = "https://hughhhhcoder.github.io/cinematic-ai-director/"
Repository = "https://github.com/Hughhhhcoder/cinematic-ai-director"
Issues = "https://github.com/Hughhhhcoder/cinematic-ai-director/issues"

[project.scripts]
cinematic-ai-director = "cinematic_ai_director.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["examples", "site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
